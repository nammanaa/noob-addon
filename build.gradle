plugins {
    id 'fabric-loom' version '1.8.13'
    id 'java'
}

group = 'com.noob'
version = '1.0.0'

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://maven.meteordev.org/releases' }
    maven { url 'https://maven.meteordev.org/snapshots' }
    maven { url 'https://libraries.minecraft.net' }
}

configurations { modCompileOnly }

dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.16.5'
    modCompileOnly('meteordevelopment:meteor-client:0.5.9-SNAPSHOT') {
        transitive = false
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar { from('LICENSE') }
